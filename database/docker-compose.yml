services:
  postgres:
    image: postgres:17-alpine
    container_name: takarlaba-postgres
    restart: always
    environment:
      POSTGRES_USER: takarlaba
      POSTGRES_PASSWORD: takarlaba_password
      POSTGRES_DB: takarlaba_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
