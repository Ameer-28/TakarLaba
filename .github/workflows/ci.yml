name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend (Format, Lint, Typecheck, Test, Build)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: testuser
          POSTGRES_PASSWORD: testpassword
          POSTGRES_DB: takarlaba_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: "postgresql://testuser:testpassword@localhost:5432/takarlaba_test?sslmode=disable"
      DIRECT_URL: "postgresql://testuser:testpassword@localhost:5432/takarlaba_test?sslmode=disable"
      TEST_DATABASE_URL: "postgresql://testuser:testpassword@localhost:5432/takarlaba_test?sslmode=disable"
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: cd backend && npm ci

      - name: Generate Prisma Client
        run: cd backend && npx prisma generate
        env:
          DATABASE_URL: "postgresql://testuser:testpassword@localhost:5432/takarlaba_test?sslmode=disable"
          DIRECT_URL: "postgresql://testuser:testpassword@localhost:5432/takarlaba_test?sslmode=disable"

      - name: Deploy database migrations
        run: cd backend && npx prisma migrate deploy

      - name: Format check
        run: cd backend && npm run format:check

      - name: Lint
        run: cd backend && npm run lint

      - name: Typecheck
        run: cd backend && npm run typecheck

      - name: Test
        run: cd backend && npm run test

      - name: Test (Integration)
        run: cd backend && npm run test:integration

      - name: Build
        run: cd backend && npm run build

  frontend:
    name: Frontend (Format, Lint, Typecheck, Test, Build)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: cd frontend && npm ci

      - name: Format check
        run: cd frontend && npm run format:check

      - name: Lint
        run: cd frontend && npm run lint

      - name: Typecheck
        run: cd frontend && npm run typecheck

      - name: Test
        run: cd frontend && npm run test

      - name: Build
        run: cd frontend && npm run build
